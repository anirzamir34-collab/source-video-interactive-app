name: Apply activity type separation

on:
  push:
    branches:
      - fix/activity-type-separation
    paths:
      - '.github/scripts/apply_activity_type_fix.py'
      - '.github/workflows/apply-activity-type-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply activity type fix
        run: python .github/scripts/apply_activity_type_fix.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify activity contracts
        run: |
          grep -q "activityTypeConfidence" server.js
          grep -q "Never default a penetrative position to vaginal" server.js
          grep -q "SECOND_PASS_ACTIVITY_CONFIDENCE" public/engine-hardening.js
          grep -q "UNVERIFIED_ACTIVITY_TYPE" public/engine-hardening.js
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js public/engine-hardening.js test/engine-hardening.test.js
          git commit -m "Separate anal and vaginal activity classification" || exit 0
          git push

name: Apply climax gate fix

on:
  push:
    branches:
      - fix/separate-lust-and-climax
    paths:
      - '.github/scripts/apply_climax_gate_fix.py'
      - '.github/workflows/apply-climax-gate-fix.yml'
      - 'public/adult-gameplay.js'
      - 'test/adult-gameplay.test.js'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/separate-lust-and-climax
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply app patch
        run: python .github/scripts/apply_climax_gate_fix.py

      - name: Run tests
        run: npm test

      - name: Check whitespace
        run: git diff --check

      - name: Verify climax contracts
        run: |
          grep -q "adultClimaxProgress" public/app.js
          grep -q "adultCorePlaySeconds" public/app.js
          grep -q "canUnlockOutcome" public/app.js
          grep -q "Final hazırlığı" public/app.js
          ! grep -q "isOutcomeUnlocked(outcome, state.maleSceneProgress, state.femaleSceneProgress)" public/app.js

      - name: Commit verified app patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          if git diff --cached --quiet; then
            echo "No app changes to commit."
          else
            git commit -m "Gate final on separate climax progression"
            git push origin HEAD:fix/separate-lust-and-climax
          fi

name: Apply Story Engine v1

on:
  push:
    branches:
      - feat/story-engine-v1
    paths:
      - '.github/scripts/apply_story_engine_v1.py'
      - '.github/workflows/apply-story-engine-v1.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply Story Engine v1 patch
        run: python .github/scripts/apply_story_engine_v1.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify Story Engine contracts
        run: |
          grep -q "STORY ENGINE V1" server.js
          grep -q "storyContextMemory" public/app.js
          grep -q "mergeStoryContexts" public/app.js
          grep -q "narrativeChoiceLabel" server.js
          grep -q "storyChoiceLabelForAction" public/app.js
          grep -q "ANALYSIS_SCHEMA_VERSION = 5" public/engine-hardening.js
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js public/engine-hardening.js package.json
          git commit -m "Add evidence-aware Story Engine v1" || exit 0
          git push

name: Fix adult runtime resume

on:
  push:
    branches:
      - hardening/engine-v1
    paths:
      - '.github/scripts/fix_runtime_adult_resume.py'
      - '.github/workflows/fix-runtime-adult-resume.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/engine-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply runtime resume fix
        run: python .github/scripts/fix_runtime_adult_resume.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/engine-hardening.js test/engine-hardening.test.js
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Preserve adult progress across resume"
            git push origin HEAD:hardening/engine-v1
          fi

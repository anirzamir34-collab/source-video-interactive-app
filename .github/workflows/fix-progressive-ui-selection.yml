name: Fix progressive UI selection safety

on:
  push:
    branches:
      - feature/progressive-adult-ui-v3
    paths:
      - .github/workflows/fix-progressive-ui-selection.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progressive-adult-ui-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply selection safety patch
        run: python .github/scripts/fix_progressive_ui_selection.py
      - name: Test
        run: npm test
      - name: Whitespace
        run: git diff --check
      - name: Commit safety fix
        run: |
          git config user.name "videoquest-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/fix_progressive_ui_selection.py
          git rm .github/workflows/fix-progressive-ui-selection.yml
          git add public/app.js
          git commit -m "Keep UI rerenders from cancelling active playback"
          git push origin HEAD:feature/progressive-adult-ui-v3

name: Apply route occurrence UI fix

on:
  push:
    branches:
      - fix/activity-route-occurrence-ui
    paths:
      - '.github/scripts/apply_route_occurrence_ui.py'
      - '.github/workflows/apply-route-occurrence-ui.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply route occurrence patch
        run: python .github/scripts/apply_route_occurrence_ui.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify route occurrence contracts
        run: |
          grep -q "activityOccurrenceNamespace" public/app.js
          grep -q "Misyoner · Anal" test/engine-hardening.test.js
          grep -q "routeNamespace" public/app.js
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/engine-hardening.js test/engine-hardening.test.js
          git commit -m "Keep anal and vaginal occurrences separate in gameplay" || exit 0
          git push

name: Apply fullscreen game HUD

on:
  push:
    branches:
      - fix/fullscreen-game-hud
    paths:
      - '.github/scripts/apply_fullscreen_game_hud.py'
      - '.github/workflows/apply-fullscreen-game-hud.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply fullscreen HUD patch
        run: python .github/scripts/apply_fullscreen_game_hud.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify fullscreen HUD contracts
        run: |
          grep -q "VIDEOQUEST FULLSCREEN HUD V4" public/styles.css
          grep -q "width: min(40vw, 440px)" public/styles.css
          grep -q "position: absolute !important" public/styles.css
          grep -q "orientation: portrait" public/styles.css
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/styles.css
          git commit -m "Move interactive choices into fullscreen game HUD" || exit 0
          git push

name: Apply JSON retry clean refresh
on:
  push:
    branches: [fix/json-retry-clean-refresh]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[json-retry-clean-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/json-retry-clean-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/patch_json_retry_clean_refresh.py
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          npm test
          git diff --check
          grep -q "gemini-storyboard-retry" server.js
          grep -q "gemini-dialogue-retry" server.js
          grep -q "clearPreviousGameResidue" public/app.js
      - name: Commit product change
        run: |
          git config user.name "videoquest-bot"
          git config user.email "videoquest-bot@users.noreply.github.com"
          git add server.js public/app.js
          git commit -m "Retry truncated Gemini JSON and clear state on refresh [json-retry-clean-patched]"
          git push origin HEAD:fix/json-retry-clean-refresh

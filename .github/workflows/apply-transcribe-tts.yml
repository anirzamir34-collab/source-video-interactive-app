name: Apply Transcribe TTS upgrade
on:
  push:
    branches: [feat/transcribe-tts-pipeline]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pipeline-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transcribe-tts-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch dialogue pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          marker="const wait = ms => new Promise(resolve => setTimeout(resolve, ms));\n"
          helper=r'''

function parseGeminiOffsetSeconds(value) {
  const match = String(value || '').trim().match(/^([0-9]+(?:\.[0-9]+)?)s$/i);
  return match ? Number(match[1]) : 0;
}

function extractTranscribeWordAnnotations(interaction) {
  const words = [];
  for (const step of interaction?.steps ?? []) {
    for (const content of step?.content ?? []) {
      for (const annotation of content?.annotations ?? []) {
        if (annotation?.type !== 'word_info') continue;
        const text = String(annotation.text || '').trim();
        if (!text) continue;
        words.push({
          text,
          speakerId: String(annotation.speaker || 'spk_unknown'),
          startTime: parseGeminiOffsetSeconds(annotation.start_offset),
          endTime: parseGeminiOffsetSeconds(annotation.end_offset)
        });
      }
    }
  }
  return words.sort((a, b) => a.startTime - b.startTime);
}

function groupTranscribeWords(words) {
  const groups = [];
  for (const word of words) {
    const last = groups.at(-1);
    const speakerChanged = last && last.speakerId !== word.speakerId;
    const gap = last ? Math.max(0, word.startTime - last.endTime) : 0;
    const tooLong = last ? word.endTime - last.startTime >= 7 : false;
    if (!last || speakerChanged || gap > 1.15 || tooLong) {
      groups.push({
        speakerId: word.speakerId,
        startTime: word.startTime,
        endTime: word.endTime,
        words: [word.text]
      });
    } else {
      last.endTime = Math.max(last.endTime, word.endTime);
      last.words.push(word.text);
    }
  }
  return groups.map((group, index) => ({
    segmentId: `asr-${String(index + 1).padStart(3, '0')}`,
    speakerId: group.speakerId,
    startTime: group.startTime,
    endTime: group.endTime,
    originalText: group.words.join(' ').replace(/\s+([,.!?;:])/g, '$1').trim()
  }));
}

async function transcribeDialogueGemini35(ai, remoteFile) {
  const interaction = await ai.interactions.create({
    model: process.env.GEMINI_TRANSCRIBE_MODEL || 'gemini-3.5-transcribe',
    input: [{
      type: 'audio',
      uri: remoteFile.uri,
      mime_type: remoteFile.mimeType
    }],
    generation_config: {
      transcription_config: {
        language_codes: [],
        mode: {
          type: 'verbatim',
          diarization_mode: 'speaker',
          timestamp_granularities: ['word']
        }
      }
    }
  });
  const words = extractTranscribeWordAnnotations(interaction);
  return {
    transcriptText: String(interaction?.output_text || '').trim(),
    words,
    segments: groupTranscribeWords(words)
  };
}
'''
          if 'async function transcribeDialogueGemini35' not in s:
              s=s.replace(marker, marker+helper, 1)

          old="""      const response = await ai.models.generateContent({\n        model: 'gemini-3.8-flash',\n        contents: [{\n          role: 'user',\n          parts: [\n            {\n              fileData: {\n                fileUri: remoteFile.uri,\n                mimeType: remoteFile.mimeType || req.file.mimetype\n              }\n            },\n            { text: prompt }\n          ]\n        }],\n        config: {\n          responseMimeType: 'application/json',\n          temperature: 0.1\n        }\n      });\n\n      const raw = String(response.text || '').trim();\n      const parsed = JSON.parse(\n        raw.replace(/^```json\\s*/i, '').replace(/```\\s*$/i, '')\n      );\n"""
          new="""      const audioMime = String(remoteFile.mimeType || req.file.mimetype || '').toLowerCase();\n      let asr = null;\n      if (audioMime.startsWith('audio/')) {\n        asr = await transcribeDialogueGemini35(ai, remoteFile);\n      }\n\n      const transcriptGrounding = asr?.segments?.length\n        ? `\\nGEMINI 3.5 TRANSCRIBE GROUND TRUTH:\\n${JSON.stringify(asr.segments)}\\n\\n- Preserve every supplied segmentId, speakerId, startTime and endTime exactly.\\n- originalText comes from the dedicated transcription model; do not paraphrase it.\\n- Translate originalText into natural Turkish and infer gender/emotion conservatively from the audio.\\n- Do not merge, split, reorder or retime these grounded segments.\\n`\n        : '';\n\n      const response = await ai.models.generateContent({\n        model: process.env.GEMINI_DIALOGUE_MODEL || 'gemini-3.8-flash',\n        contents: [{\n          role: 'user',\n          parts: [\n            {\n              fileData: {\n                fileUri: remoteFile.uri,\n                mimeType: remoteFile.mimeType || req.file.mimetype\n              }\n            },\n            { text: prompt + transcriptGrounding }\n          ]\n        }],\n        config: {\n          responseMimeType: 'application/json',\n          temperature: 0.05\n        }\n      });\n\n      const raw = String(response.text || '').trim();\n      const parsed = JSON.parse(\n        raw.replace(/^```json\\s*/i, '').replace(/```\\s*$/i, '')\n      );\n\n      if (asr?.segments?.length) {\n        const enriched = new Map(\n          (Array.isArray(parsed.segments) ? parsed.segments : []).map(item => [String(item.segmentId || ''), item])\n        );\n        parsed.segments = asr.segments.map((grounded, index) => {\n          const item = enriched.get(grounded.segmentId) || parsed.segments?.[index] || {};\n          return {\n            ...item,\n            segmentId: grounded.segmentId,\n            speakerId: grounded.speakerId,\n            startTime: grounded.startTime,\n            endTime: grounded.endTime,\n            originalText: grounded.originalText,\n            turkishText: String(item.turkishText || grounded.originalText).trim()\n          };\n        });\n        parsed.transcriptionEngine = process.env.GEMINI_TRANSCRIBE_MODEL || 'gemini-3.5-transcribe';\n      }\n"""
          if old not in s:
              raise SystemExit('dialogue block not found')
          s=s.replace(old,new,1)

          old_return="""        warnings: Array.isArray(parsed.warnings) ? parsed.warnings : []\n      });"""
          new_return="""        warnings: Array.isArray(parsed.warnings) ? parsed.warnings : [],\n        transcriptionEngine: String(parsed.transcriptionEngine || 'gemini-3.8-flash-fallback'),\n        translationEngine: process.env.GEMINI_DIALOGUE_MODEL || 'gemini-3.8-flash',\n        dubbingEngine: process.env.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview'\n      });"""
          # Replace the dialogue endpoint return nearest after sourceLanguage by targeting unique summary block.
          anchor="""        sourceLanguage: String(parsed.sourceLanguage || 'unknown'),\n        summaryTr: String(parsed.summaryTr || ''),\n        speakers: Array.isArray(parsed.speakers) ? parsed.speakers : [],\n        segments,\n        warnings: Array.isArray(parsed.warnings) ? parsed.warnings : []\n      });"""
          replacement="""        sourceLanguage: String(parsed.sourceLanguage || 'unknown'),\n        summaryTr: String(parsed.summaryTr || ''),\n        speakers: Array.isArray(parsed.speakers) ? parsed.speakers : [],\n        segments,\n        warnings: Array.isArray(parsed.warnings) ? parsed.warnings : [],\n        transcriptionEngine: String(parsed.transcriptionEngine || 'gemini-3.8-flash-fallback'),\n        translationEngine: process.env.GEMINI_DIALOGUE_MODEL || 'gemini-3.8-flash',\n        dubbingEngine: process.env.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview'\n      });"""
          if anchor not in s:
              raise SystemExit('dialogue return not found')
          s=s.replace(anchor,replacement,1)
          s=s.replace("model: 'gemini-3.1-flash-tts-preview',", "model: process.env.GEMINI_TTS_MODEL || 'gemini-3.1-flash-tts-preview',")
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check server.js
          npm test
          git diff --check
          grep -q "gemini-3.5-transcribe" server.js
          grep -q "GEMINI_TTS_MODEL" server.js
      - name: Commit product change
        run: |
          git config user.name "videoquest-bot"
          git config user.email "videoquest-bot@users.noreply.github.com"
          git add server.js
          git commit -m "Upgrade dialogue to Transcribe plus TTS [pipeline-patched]"
          git push origin HEAD:feat/transcribe-tts-pipeline

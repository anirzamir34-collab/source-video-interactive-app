name: Apply verified position occurrence fix

on:
  push:
    branches:
      - codex/fix-position-occurrences

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Remove temporary position occurrence workflow')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-position-occurrences
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply occurrence and latest-seek fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 regex match, found {count}')
              return updated

          app_path = Path('public/app.js')
          app = app_path.read_text(encoding='utf-8')

          app = replace_once(
              app,
              "  adultLoopSeeking: false,\n  adultSeekTimer: null,\n  lastAdultFrameNow: null,",
              "  adultLoopSeeking: false,\n  adultSeekTimer: null,\n  adultSeekListener: null,\n  adultSeekRequestId: 0,\n  adultSelectionToken: 0,\n  lastAdultFrameNow: null,",
              'adult seek state'
          )

          app = replace_once(
              app,
              '      positionId: String(a.positionId || ""),\n      activityType: String(a.activityType || ""),',
              '      positionId: String(a.positionId || ""),\n      positionOccurrenceId: String(a.positionOccurrenceId || ""),\n      activityType: String(a.activityType || ""),',
              'normalized occurrence field'
          )

          occurrence_helper = r'''function assignPositionOccurrenceIds(actions) {
            const groups = new Map();

            actions.forEach((action, index) => {
              if (!action.adultScene || !action.positionId) return;

              const canonical = canonicalAdultPosition(action);
              const familyId = canonical.id || normalizeAdultLabel(action.positionId);
              if (!familyId) return;

              const sceneId = action.adultSceneId ||
                `adult-${Math.round(action.adultSceneStartTime || action.startTime)}`;
              const rawStart = Number(action.positionStartTime);
              const rawEnd = Number(action.positionEndTime);
              const startTime = Number.isFinite(rawStart)
                ? rawStart
                : Number(action.startTime) || 0;
              const endCandidate = Number.isFinite(rawEnd)
                ? rawEnd
                : Number(action.endTime) || startTime;
              const endTime = Math.max(startTime, endCandidate);
              const key = `${sceneId}::${familyId}`;

              if (!groups.has(key)) {
                groups.set(key, { sceneId, familyId, entries: [] });
              }

              groups.get(key).entries.push({
                action,
                index,
                startTime,
                endTime
              });
            });

            groups.forEach(group => {
              const occurrences = [];

              group.entries.forEach(entry => {
                const explicitId = String(
                  entry.action.positionOccurrenceId || ''
                ).trim();
                if (!explicitId) return;

                let occurrence = occurrences.find(item => item.id === explicitId);
                if (!occurrence) {
                  occurrence = {
                    id: explicitId,
                    startTime: entry.startTime,
                    endTime: entry.endTime
                  };
                  occurrences.push(occurrence);
                } else {
                  occurrence.startTime = Math.min(occurrence.startTime, entry.startTime);
                  occurrence.endTime = Math.max(occurrence.endTime, entry.endTime);
                }
              });

              let generatedCount = 0;
              const sortedEntries = [...group.entries]
                .sort((a, b) => a.startTime - b.startTime || a.index - b.index);

              sortedEntries.forEach(entry => {
                if (String(entry.action.positionOccurrenceId || '').trim()) return;

                const matching = occurrences
                  .filter(occurrence =>
                    entry.startTime <= occurrence.endTime + 0.15 &&
                    entry.endTime >= occurrence.startTime - 0.15
                  )
                  .sort((a, b) =>
                    Math.abs(a.startTime - entry.startTime) -
                    Math.abs(b.startTime - entry.startTime)
                  )[0];

                let occurrence = matching;
                if (!occurrence) {
                  generatedCount += 1;
                  const sceneSlug = normalizeAdultLabel(group.sceneId)
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-|-$/g, '') || 'adult';
                  const familySlug = normalizeAdultLabel(group.familyId)
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-|-$/g, '') || 'position';
                  occurrence = {
                    id: `${sceneSlug}:${familySlug}:occ-${String(generatedCount).padStart(2, '0')}-${Math.round(entry.startTime * 1000)}`,
                    startTime: entry.startTime,
                    endTime: entry.endTime
                  };
                  occurrences.push(occurrence);
                } else {
                  occurrence.startTime = Math.min(occurrence.startTime, entry.startTime);
                  occurrence.endTime = Math.max(occurrence.endTime, entry.endTime);
                }

                entry.action.positionOccurrenceId = occurrence.id;
              });
            });
          }

          '''

          app = replace_once(
              app,
              'function normalizeAnalysis(body) {',
              occurrence_helper + 'function normalizeAnalysis(body) {',
              'occurrence fallback helper'
          )

          app = replace_once(
              app,
              '    .filter(a => Number.isFinite(a.startTime) && Number.isFinite(a.endTime) && a.endTime > a.startTime && a.sourceVerified)\n    .sort((a, b) => a.startTime - b.startTime);\n\n  return {',
              '    .filter(a => Number.isFinite(a.startTime) && Number.isFinite(a.endTime) && a.endTime > a.startTime && a.sourceVerified)\n    .sort((a, b) => a.startTime - b.startTime);\n\n  assignPositionOccurrenceIds(cleaned);\n\n  return {',
              'assign fallback occurrence IDs'
          )

          app = replace_once(
              app,
              '  state.activePositionId = null;\n  state.activeAdultCategory = null;\n  state.activeMovementId = null;\n  state.maleSceneProgress = 0;',
              '  state.activePositionId = null;\n  state.activeAdultCategory = null;\n  state.activeMovementId = null;\n  state.adultSelectionToken += 1;\n  cancelAdultSeek();\n  state.maleSceneProgress = 0;',
              'interactive reset invalidates seek'
          )

          app = replace_once(
              app,
              '    const category = adultCategoryFor(action, canonical.id);\n    const positionKey = `${category.id}:${canonical.id}`;',
              "    const category = adultCategoryFor(action, canonical.id);\n    const occurrenceId = String(\n      action.positionOccurrenceId ||\n      `${sceneId}:${canonical.id}:legacy-${Math.round((Number(action.positionStartTime ?? action.startTime) || 0) * 1000)}`\n    );\n    const positionKey = `${category.id}:${canonical.id}:${occurrenceId}`;",
              'occurrence-aware position key'
          )

          app = replace_once(
              app,
              '        id: positionKey,\n        familyId: canonical.id,\n        label: canonical.label,',
              '        id: positionKey,\n        familyId: canonical.id,\n        occurrenceId,\n        label: canonical.label,',
              'position occurrence metadata'
          )

          app = replace_once(
              app,
              '    .filter(scene => scene.positions.length)\n    .sort((a, b) => a.startTime - b.startTime);\n}',
              '''    .filter(scene => scene.positions.length)
    .sort((a, b) => a.startTime - b.startTime);

  state.adultScenes.forEach(scene => {
    const totals = new Map();
    const indexes = new Map();

    scene.positions.forEach(position => {
      const key = `${position.categoryId}:${position.familyId}`;
      totals.set(key, (totals.get(key) || 0) + 1);
    });

    scene.positions.forEach(position => {
      const key = `${position.categoryId}:${position.familyId}`;
      if ((totals.get(key) || 0) <= 1) return;

      const occurrenceNumber = (indexes.get(key) || 0) + 1;
      indexes.set(key, occurrenceNumber);
      const baseLabel = String(position.label || 'Pozisyon')
        .replace(/\s+·\s+\d+$/u, '')
        .replace(/\s+Pozisyon(?:u)?$/iu, '');
      position.label = `${baseLabel} · ${occurrenceNumber}`;
    });
  });
}''',
              'repeated occurrence labels'
          )

          selection_block = r'''function cancelAdultSeek() {
            state.adultSeekRequestId += 1;
            clearTimeout(state.adultSeekTimer);
            state.adultSeekTimer = null;

            if (state.adultSeekListener && els.video) {
              els.video.removeEventListener("seeked", state.adultSeekListener);
            }

            state.adultSeekListener = null;
            state.adultLoopSeeking = false;
          }

          function beginAdultSelection() {
            state.adultSelectionToken += 1;
            cancelAdultSeek();
            return state.adultSelectionToken;
          }

          function selectAdultPosition(positionId, shouldSeek = true) {
            const scene = state.adultScene;
            const position = scene?.positions.find(item => item.id === positionId);
            if (!position) return;

            const selectionToken = beginAdultSelection();
            const changedPosition = state.activePositionId !== position.id;
            state.activePositionId = position.id;
            if (changedPosition) state.activeMovementId = null;

            els.positionTabs?.querySelectorAll(".position-tab").forEach(button => {
              button.classList.toggle("active", button.dataset.positionId === position.id);
            });

            if (els.movementHeading) els.movementHeading.textContent = position.label;
            if (els.movementCount) els.movementCount.textContent = `${position.movements.length} gerçek değişim`;
            if (els.movementChoices) els.movementChoices.innerHTML = "";

            position.movements.forEach(movement => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "movement-choice-card";
              button.dataset.movementId = movement.id;
              button.innerHTML = `<span>${escapeHtml(movement.label)}</span><small>${adultTimeLabel(movement.loopStartTime)} – ${adultTimeLabel(movement.loopEndTime)}</small>`;
              button.addEventListener("click", () => selectAdultMovement(movement.id, true));
              els.movementChoices?.appendChild(button);
            });

            const movement = position.movements.find(item => item.id === state.activeMovementId) || position.movements[0];

            if (movement) {
              selectAdultMovement(movement.id, shouldSeek, selectionToken);
            } else {
              state.activeMovementId = null;
              if (els.movementChoices) els.movementChoices.innerHTML = '';
              if (els.movementCount) els.movementCount.textContent = '10 saniyelik ek seçenek yok';
              if (shouldSeek && els.video) {
                els.video.pause();
                seekAdultLoop(position.startTime, selectionToken);
                els.video.play().catch(() => {});
              }
            }
          }

          function selectAdultMovement(movementId, shouldSeek = true, selectionToken = null) {
            const position = state.adultScene?.positions.find(item => item.id === state.activePositionId);
            const movement = position?.movements.find(item => item.id === movementId);
            if (!movement) return;

            const effectiveToken = selectionToken ?? beginAdultSelection();
            state.activeMovementId = movement.id;
            state.lastAdultMediaTime = null;
            els.movementChoices?.querySelectorAll(".movement-choice-card").forEach(button => {
              button.classList.toggle("active", button.dataset.movementId === movement.id);
            });

            if (shouldSeek && els.video) {
              els.video.pause();
              seekAdultLoop(movement.loopStartTime, effectiveToken);
              els.video.play().catch(() => {});
            }
          }

          function finishAdultScene() {
            const scene = state.adultScene;
            if (!scene) return;
            if (!state.completedAdultSceneIds) state.completedAdultSceneIds = new Set();
            state.completedAdultSceneIds.add(scene.id);
            state.adultSelectionToken += 1;
            cancelAdultSeek();
            state.adultMode = false;
            state.adultScene = null;
            state.activePositionId = null;
            state.activeAdultCategory = null;
            state.activeMovementId = null;
            state.lastAdultMediaTime = null;
            els.adultInteractionPanel?.classList.add("hidden");
            document.querySelector(".choice-navigation")?.classList.remove("hidden");
            if (els.video) {
              els.video.currentTime = Math.min(scene.postSceneTime, els.video.duration || scene.postSceneTime);
              els.video.play().catch(() => {});
            }
            state.gameCursorTime = scene.postSceneTime;
            renderChoices();
          }

          function seekAdultLoop(targetTime, selectionToken = state.adultSelectionToken) {
            if (!els.video) return false;

            cancelAdultSeek();
            const requestId = state.adultSeekRequestId;
            const target = Math.max(0, Number(targetTime) || 0);
            state.adultLoopSeeking = true;

            const finishSeek = (force = false) => {
              if (
                requestId !== state.adultSeekRequestId ||
                selectionToken !== state.adultSelectionToken
              ) {
                return;
              }

              if (
                !force &&
                (els.video.seeking || Math.abs((Number(els.video.currentTime) || 0) - target) > 0.25)
              ) {
                return;
              }

              if (state.adultSeekListener === onSeeked) {
                els.video.removeEventListener("seeked", onSeeked);
                state.adultSeekListener = null;
              }

              clearTimeout(state.adultSeekTimer);
              state.adultSeekTimer = null;
              state.adultLoopSeeking = false;
              state.lastAdultFrameNow = performance.now();
            };

            const onSeeked = () => finishSeek(false);
            state.adultSeekListener = onSeeked;
            els.video.addEventListener("seeked", onSeeked);
            els.video.currentTime = target;
            state.adultSeekTimer = setTimeout(() => finishSeek(true), 1500);
            return true;
          }

          function updateAdultPlayback'''

          app = regex_once(
              app,
              r'function selectAdultPosition\(positionId, shouldSeek = true\) \{.*?\n\}\n\nfunction updateAdultPlayback',
              selection_block,
              'latest-selection seek block'
          )

          app = replace_once(
              app,
              '    seekAdultLoop(movement.loopStartTime);\n    state.lastAdultFrameNow = now;',
              '    seekAdultLoop(movement.loopStartTime, state.adultSelectionToken);\n    state.lastAdultFrameNow = now;',
              'loop seek uses current selection token'
          )

          app_path.write_text(app, encoding='utf-8')

          server_path = Path('server.js')
          server = server_path.read_text(encoding='utf-8')

          server = replace_once(
              server,
              '      "positionId": "",\n      "activityType": "oral|manual|vaginal|anal|other",',
              '      "positionId": "",\n      "positionOccurrenceId": "",\n      "activityType": "oral|manual|vaginal|anal|other",',
              'Gemini JSON occurrence field'
          )

          server = replace_once(
              server,
              '- Merge duplicate detections of the same stable position when their time ranges overlap; position ranges must be chronological, non-overlapping and contained inside the verified adult scene.',
              '- Merge duplicate detections only when they describe the same continuous occurrence and their time ranges overlap; never bridge separate appearances of the same position into one long range.',
              'continuous occurrence merge rule'
          )

          server = replace_once(
              server,
              '- Give every verified position a stable positionId, exact Turkish positionLabel, positionStartTime and positionEndTime.',
              '- Give every verified position a stable positionId, exact Turkish positionLabel, positionStartTime and positionEndTime.\n- Keep positionId as the canonical semantic position family. Give each uninterrupted occurrence of that family a stable positionOccurrenceId; if the same position returns later after another position, transition, cut, or real time gap, it must have a different positionOccurrenceId.',
              'Gemini occurrence semantics'
          )

          server = replace_once(
              server,
              "          positionId: String(action.positionId || ''),\n          activityType: ['oral', 'manual', 'vaginal', 'anal'].includes(",
              "          positionId: String(action.positionId || ''),\n          positionOccurrenceId: String(action.positionOccurrenceId || ''),\n          activityType: ['oral', 'manual', 'vaginal', 'anal'].includes(",
              'server occurrence normalization'
          )

          server_path.write_text(server, encoding='utf-8')
          PY

      - name: Run repository tests
        run: npm test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet -- public/app.js server.js; then
            echo "No changes produced; refusing to create an empty fix commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js server.js
          git commit -m "Fix repeated adult position occurrences"
          git push origin HEAD:codex/fix-position-occurrences

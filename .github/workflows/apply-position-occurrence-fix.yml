name: Apply verified position occurrence fix

on:
  push:
    branches:
      - codex/fix-position-occurrences
    paths:
      - .github/workflows/apply-position-occurrence-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-position-occurrences
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fix
        run: python3 .github/scripts/apply_position_occurrence_fix.py

      - name: Run repository tests
        run: npm test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet -- public/app.js server.js; then
            echo "No app/server changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js server.js
          git commit -m "Fix repeated adult position occurrences"
          git push origin HEAD:codex/fix-position-occurrences

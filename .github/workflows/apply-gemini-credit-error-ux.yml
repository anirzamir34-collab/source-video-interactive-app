name: Apply Gemini credit exhaustion UX

on:
  push:
    branches:
      - fix/gemini-credit-error-ux
    paths:
      - '.github/scripts/apply_gemini_credit_error_ux.py'
      - '.github/workflows/apply-gemini-credit-error-ux.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply credit exhaustion patch
        run: python .github/scripts/apply_gemini_credit_error_ux.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify credit error contracts
        run: |
          grep -q "GEMINI_CREDITS_DEPLETED" server.js
          grep -q "retryable: false" server.js
          grep -q "Gemini API kredisi tükendi" public/app.js
          grep -q "failureBody?.retryable === false" public/app.js
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/app.js
          git commit -m "Show Gemini credit exhaustion and stop useless retries" || exit 0
          git push

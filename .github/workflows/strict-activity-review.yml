name: Strict activity type review

on:
  push:
    branches:
      - fix/activity-type-strict-review
    paths:
      - '.github/scripts/strict_activity_review.py'
      - '.github/workflows/strict-activity-review.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply strict route review patch
        run: python .github/scripts/strict_activity_review.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify strict route review
        run: |
          grep -q "every explicit vaginal or anal claim" test/engine-hardening.test.js
          grep -q "Treat the first-pass route as untrusted" server.js
          grep -q "isCorePositionCritical(action) && isPenetrativeActivity(action)" public/engine-hardening.js
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/engine-hardening.js test/engine-hardening.test.js
          git commit -m "Always recheck vaginal and anal activity type" || exit 0
          git push

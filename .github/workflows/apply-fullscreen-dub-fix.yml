name: Apply fullscreen dubbing fix
on:
  push:
    branches:
      - fix/fullscreen-dub-quota-ui
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fullscreen-dub-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fullscreen-dub-quota-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python3 scripts/patch_fullscreen_dub_fix.py
      - name: Validate
        run: |
          node --check server.js
          node --check public/app.js
          npm test
          git diff --check
          grep -q "GEMINI_TTS_DAILY_LIMIT" server.js
          grep -q "VIDEOQUEST FULLSCREEN HUD FIX V5" public/styles.css
      - name: Commit product fix
        run: |
          git config user.name "videoquest-bot"
          git config user.email "videoquest-bot@users.noreply.github.com"
          git add server.js public/app.js public/styles.css
          git commit -m "Fix fullscreen HUD and TTS quota handling [fullscreen-dub-patched]"
          git push origin HEAD:fix/fullscreen-dub-quota-ui

name: Apply adult gameplay v2

on:
  push:
    branches:
      - feature/adult-scene-gameplay-v2

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/adult-scene-gameplay-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply gameplay patch
        run: python .github/scripts/apply_adult_gameplay_v2.py

      - name: Run repository tests
        run: npm test

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify gameplay contracts
        run: |
          grep -q "positionOccurrenceId" public/app.js
          grep -q "pickNextVariant" public/app.js
          grep -q "outcomeType" server.js
          grep -q "outcomeSection" public/index.html
          grep -q "VIDEOQUEST ADULT GAMEPLAY V2" public/styles.css

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/styles.css server.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "Upgrade adult scene interactive gameplay"
            git push origin HEAD:feature/adult-scene-gameplay-v2
          fi

name: Fix second-pass retry hardening

on:
  push:
    branches:
      - hardening/engine-v1
    paths:
      - '.github/scripts/fix_second_pass_retry.py'
      - '.github/workflows/fix-second-pass-retry.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/engine-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply retry hardening
        run: python .github/scripts/fix_second_pass_retry.py
      - name: Run full tests
        run: npm test
      - name: Check whitespace
        run: git diff --check
      - name: Verify staged confidence and clean retry
        run: |
          grep -q "form.delete('reviewMode')" public/app.js
          grep -q "strictMinimum" server.js
          grep -q "Math.max(0.4, strictMinimum - 0.18)" server.js
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js server.js
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Harden visual review retries"
            git push origin HEAD:hardening/engine-v1
          fi

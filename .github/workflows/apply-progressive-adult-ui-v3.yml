name: Apply progressive adult UI v3

on:
  push:
    branches:
      - feature/progressive-adult-ui-v3
    paths:
      - .github/workflows/apply-progressive-adult-ui-v3.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/progressive-adult-ui-v3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply progressive discovery patch
        run: python .github/scripts/apply_progressive_adult_ui_v3.py

      - name: Run repository tests
        run: npm test

      - name: Check whitespace
        run: git diff --check

      - name: Verify progressive UI contracts
        run: |
          grep -q "adultDiscoveryPhase" public/app.js
          grep -q "playAdultPrelude" public/app.js
          grep -q "positionUnlockProgress" public/app.js
          grep -q "adultPhaseBadge" public/index.html
          grep -q "discoveryGate" public/index.html
          grep -q "PROGRESSIVE DISCOVERY UI V3" public/styles.css
          grep -q "Kilitli" public/index.html && exit 1 || true

      - name: Commit verified product changes
        run: |
          git config user.name "videoquest-actions"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/apply_progressive_adult_ui_v3.py
          git rm .github/workflows/apply-progressive-adult-ui-v3.yml
          git add public/app.js public/styles.css
          git commit -m "Make adult scene UI progressively discoverable"
          git push origin HEAD:feature/progressive-adult-ui-v3

name: Apply full analysis and segment dub fix

on:
  push:
    branches:
      - fix/full-analysis-and-segment-dub
    paths:
      - '.github/scripts/apply_full_analysis_segment_dub.py'
      - '.github/workflows/apply-full-analysis-segment-dub.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-analysis-and-segment-dub
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preserve patch replacement escapes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_full_analysis_segment_dub.py')
          text = path.read_text()
          old = "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if old not in text:
              raise SystemExit('sub_once implementation not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply product fix
        run: python .github/scripts/apply_full_analysis_segment_dub.py

      - name: Run repository tests
        run: npm test

      - name: Check whitespace
        run: git diff --check

      - name: Verify fix contracts
        run: |
          grep -q "INCOMPLETE_CHUNK_ANALYSIS" public/app.js
          grep -q "isCompleteChunkAnalysis" public/app.js
          grep -q "/api/gemini-dub-segment" public/app.js
          grep -q "prefetchDubSegmentsAround" public/app.js
          ! grep -q "getDubBlockAt" public/app.js

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "Require full video analysis and sync dub per dialogue"
            git push origin HEAD:fix/full-analysis-and-segment-dub
          fi

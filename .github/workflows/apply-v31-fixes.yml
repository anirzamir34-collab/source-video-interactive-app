name: Apply v3.1 interaction fixes

on:
  push:
    branches:
      - feature/fix-progressive-sequence-dub-v31
    paths:
      - '.github/scripts/apply_v31_fixes.py'
      - '.github/scripts/prepare_v31_patch.py'
      - '.github/workflows/apply-v31-fixes.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/fix-progressive-sequence-dub-v31
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare patch for current code
        run: python .github/scripts/prepare_v31_patch.py

      - name: Apply v3.1 fixes
        run: python .github/scripts/apply_v31_fixes.py

      - name: Run repository tests
        run: npm test

      - name: Check whitespace
        run: git diff --check

      - name: Verify bugfix contracts
        run: |
          grep -q "monotonicAdultPhase" public/app.js
          grep -q "warmupRemaining" public/app.js
          grep -q "addEventListener('seeked'" public/app.js
          grep -q "positionLabel and the visible body configuration" server.js
          grep -q "mergeAdultSceneFragments" public/app.js

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/adult-gameplay.js test/adult-gameplay.test.js server.js
          if git diff --cached --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "Fix progressive scene ordering and dub seek sync"
            git push origin HEAD:feature/fix-progressive-sequence-dub-v31
          fi
